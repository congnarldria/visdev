<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>區域特徵</title>
  <link rel="icon" href="/static/magpie.ico">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #14171c;
      color: #d5deea;
      font: 13px/1.4 "Segoe UI", "Microsoft JhengHei", sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
      padding: 8px 12px;
      border-bottom: 1px solid #2a3140;
    }
    header strong { font-size: 14px; }
    header span { color: #8b98ab; font-size: 12px; }
    #title {
      padding: 8px 12px;
      color: #ffe14a;
      border-bottom: 1px solid #2a3140;
    }
    #viewbar { display: flex; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid #2a3140; }
    #viewbar button.on { background: #1d4e86; color: #fff; }
    #stage { position: relative; height: 280px; flex: none; background: #101216; }
    #view { width: 100%; height: 100%; display: block; }
    #view.mode-select { cursor: default; }
    #view.mode-pan { cursor: grab; }
    #view.mode-zoom { cursor: zoom-in; }
    #split { flex: 1; min-height: 0; display: flex; }
    #list { flex: none; overflow: auto; padding: 8px 12px 16px; border-right: 1px solid #2a3140; }
    #custom { flex: 1; min-width: 180px; overflow: auto; padding: 8px 12px 16px; }
    #custom h2 { margin: 2px 0 8px; color: #9eb0c8; font-size: 12px; font-weight: 600; }
    .crow { display: flex; gap: 16px; align-items: baseline; padding: 3px 0; }
    .cn { font: 13px/1.3 Consolas, "Cascadia Mono", monospace; color: #d5fbe6; }
    .cv {
      margin-left: auto;
      text-align: right;
      font: 13px/1.3 Consolas, "Cascadia Mono", monospace;
      color: #f4f7fb;
    }
    #custom .empty { color: #8b98ab; }
    #errDialog[hidden] { display: none !important; }
    #errDialog { display: flex; align-items: center; justify-content: center; }
    table {
      border-collapse: collapse;
      width: max-content;
      max-width: 100%;
    }
    th, td {
      padding: 3px 8px;
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }
    th {
      color: #9eb0c8;
      font-weight: 600;
      font-size: 12px;
      border-bottom: 1px solid #2a3140;
    }
    tr.group td {
      padding-top: 12px;
      color: #9eb0c8;
      font-size: 12px;
    }
    tr.item:hover td { background: #1c2430; }
    .name { font: 13px/1.3 Consolas, "Cascadia Mono", monospace; }
    .hint { color: #8b98ab; margin-left: 8px; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; }
    td.value {
      font: 13px/1.3 Consolas, "Cascadia Mono", monospace;
      color: #f4f7fb;
      padding-left: 18px;
    }
  </style>
</head>
<body>
  <header>
    <strong>區域特徵</strong>
    <span>一次只顯示點到的那一個。白色虛線是點到的地方。</span>
  </header>
  <div id="viewbar">
    <span>圖上可點選、移動、放大</span>
    <button type="button" data-mode="select">點選</button>
    <button type="button" data-mode="pan">移動</button>
    <button type="button" data-mode="zoom">放大</button>
    <button id="fit" type="button">符合</button>
    <button id="one" type="button">1:1</button>
    <button id="out" type="button">−</button>
    <button id="in" type="button">+</button>
  </div>
  <div id="stage"><canvas id="view"></canvas></div>
  <div id="title">請點一個區域或輪廓。沒點到之前不顯示數值。</div>
  <div id="errDialog" hidden style="position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.48)">
    <div style="width:min(420px,calc(100vw - 32px));background:#1c2028;border:1px solid #ff5d4a;padding:16px">
      <strong style="color:#ffb0a6">錯誤</strong>
      <p id="errText" style="white-space:pre-wrap"></p>
      <div style="text-align:right"><button id="errOk" type="button">確定</button></div>
    </div>
  </div>
  <div id="split">
    <div id="list"></div>
    <aside id="custom">
      <h2>自訂變數</h2>
      <div id="customList" class="empty">執行程式後，數值會靠右顯示。</div>
    </aside>
  </div>
  <script src="/static/geom.js?v=3"></script>
  <script src="/static/view.js?v=4"></script>
  <script>
    const GRAY_LABELS = {
      gray_min: "最小輝度",
      gray_max: "最大輝度",
      gray_mean: "平均輝度",
      gray_deviation: "輝度標準差",
      gray_median: "輝度中位數",
    };
    const DEFAULT_KEYS = [
      "region:area", "region:row", "region:column", "region:circularity", "region:contlength",
      "gray:gray_mean", "gray:gray_deviation",
      "xld:contlength", "subpixel",
    ];
    const params = new URLSearchParams(location.search);
    let sessionId = params.get("id") || "";
    let pick = null;
    let catalog = { region: [], xld: [], gray: Object.keys(GRAY_LABELS) };
    const list = document.getElementById("list");
    const title = document.getElementById("title");
    let picture = null;

    function savedKeys() {
      try {
        const saved = JSON.parse(localStorage.getItem("visdev.features") || "null");
        if (Array.isArray(saved)) return new Set(saved);
      } catch (_err) { /* 用預設 */ }
      return new Set(DEFAULT_KEYS);
    }

    function checkedKeys() {
      return [...list.querySelectorAll("input:checked")].map((input) => input.dataset.feature);
    }

    function splitKeys(keys) {
      const region = [];
      const xld = [];
      const gray = [];
      keys.forEach((key) => {
        const cut = key.indexOf(":");
        if (cut < 0) return;
        const kind = key.slice(0, cut);
        const name = key.slice(cut + 1);
        if (kind === "region") region.push(name);
        if (kind === "xld") xld.push(name);
        if (kind === "gray") gray.push(name);
      });
      return { region, xld, gray };
    }

    function build() {
      const chosen = savedKeys();
      const groups = [
        ["區域", catalog.region.map((name) => [`region:${name}`, name, ""])],
        ["輝度", catalog.gray.map((name) => [`gray:${name}`, name, GRAY_LABELS[name] || ""])],
        ["XLD", catalog.xld.map((name) => [`xld:${name}`, name, ""])],
        ["輪廓", [["subpixel", "次像素 contour", "畫在主視窗"]]],
      ];
      list.innerHTML = "";
      const table = document.createElement("table");
      const head = document.createElement("tr");
      ["", "feature", "值"].forEach((text) => {
        const cell = document.createElement("th");
        cell.textContent = text;
        head.appendChild(cell);
      });
      table.appendChild(head);
      groups.forEach(([heading, rows]) => {
        const group = document.createElement("tr");
        group.className = "group";
        const titleCell = document.createElement("td");
        titleCell.colSpan = 3;
        titleCell.textContent = heading;
        group.appendChild(titleCell);
        table.appendChild(group);
        rows.forEach(([key, name, hint]) => {
          const row = document.createElement("tr");
          row.className = "item";
          const check = document.createElement("td");
          const input = document.createElement("input");
          input.type = "checkbox";
          input.dataset.feature = key;
          input.checked = chosen.has(key);
          check.appendChild(input);
          const label = document.createElement("td");
          label.className = "name";
          label.textContent = name;
          if (hint) {
            const note = document.createElement("span");
            note.className = "hint";
            note.textContent = hint;
            label.appendChild(note);
          }
          const value = document.createElement("td");
          value.className = "value";
          value.dataset.value = key;
          row.append(check, label, value);
          table.appendChild(row);
        });
      });
      list.appendChild(table);
    }

    function clearValues() {
      list.querySelectorAll(".value").forEach((node) => { node.textContent = ""; });
    }

    function showValues(data) {
      const map = {};
      Object.entries(data.region || {}).forEach(([name, value]) => { map[`region:${name}`] = value; });
      Object.entries(data.xld || {}).forEach(([name, value]) => { map[`xld:${name}`] = value; });
      Object.entries(data.gray || {}).forEach(([name, value]) => { map[`gray:${name}`] = value; });
      list.querySelectorAll(".value").forEach((node) => {
        const input = node.parentElement.querySelector("input");
        if (!input.checked || input.dataset.feature === "subpixel") {
          node.textContent = "";
          return;
        }
        if (data.kind === "xld" && input.dataset.feature.startsWith("gray:")) {
          node.textContent = "輪廓沒有輝度";
          return;
        }
        if (!data.grayReady && input.dataset.feature.startsWith("gray:")) {
          node.textContent = "無影像";
          return;
        }
        const value = map[input.dataset.feature];
        node.textContent = value == null ? "" : String(value);
      });
    }

    async function refresh() {
      if (!pick || (pick.kind !== "region" && pick.kind !== "xld")) {
        title.textContent = "請在主視窗點選一個區域或輪廓。";
        clearValues();
        return;
      }
      const kind = pick.kind === "xld" ? "xld" : "region";
      sessionId = pick.id || sessionId;
      const where = pick.name === "__preview__" ? "預覽" : pick.name;
      title.textContent = `${kind === "xld" ? "輪廓" : "區域"} ${where}  #${pick.index + 1}（只顯示這一個）`;
      const keys = checkedKeys();
      const choice = splitKeys(keys);
      if (!sessionId || (!choice.region.length && !choice.xld.length && (kind === "xld" || !choice.gray.length))) {
        clearValues();
        return;
      }
      const res = await fetch("/api/features", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id: sessionId,
          name: pick.name,
          index: pick.index,
          kind,
          region: choice.region,
          xld: choice.xld,
          gray: kind === "region" ? choice.gray : [],
          subpixel: false,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        const detail = typeof data.detail === "string" ? data.detail : "讀取特徵失敗";
        title.textContent = detail;
        clearValues();
        document.getElementById("errText").textContent = detail;
        document.getElementById("errDialog").hidden = false;
        return;
      }
      showValues(data);
    }

    function publish() {
      localStorage.setItem("visdev.features", JSON.stringify(checkedKeys()));
      channel.postMessage({ type: "features" });
      refresh();
    }

    function esc(text) {
      return String(text ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
    }

    function renderCustom(data) {
      const box = document.getElementById("customList");
      const rows = [];
      (data.iconic || []).forEach((item) => {
        rows.push(`<div class="crow"><span class="cn">${esc(item.name)}</span><span class="cv">${esc(item.text)}</span></div>`);
      });
      (data.control || []).forEach((item) => {
        rows.push(`<div class="crow"><span class="cn">${esc(item.name)}</span><span class="cv">${esc(item.text)}</span></div>`);
      });
      box.className = rows.length ? "" : "empty";
      box.innerHTML = rows.join("") || "執行程式後，數值會靠右顯示。";
    }

    function takeVars(data) {
      if (!data || data.type !== "vars") return;
      renderCustom(data);
    }

    function takePick(data) {
      if (!data || data.type !== "pick") return;
      if (data.clear) {
        pick = null;
        title.textContent = "請點一個區域或輪廓。沒點到之前不顯示數值。";
        clearValues();
        if (picture) picture.setSelection(null);
        return;
      }
      pick = data;
      if (picture) picture.setSelection({ name: data.name, index: data.index, kind: data.kind });
      refresh();
    }

    document.getElementById("errOk").onclick = () => { document.getElementById("errDialog").hidden = true; };
    list.addEventListener("change", publish);
    const channel = new BroadcastChannel("visdev-features");
    const displayChannel = new BroadcastChannel("visdev-display");
    const modeButtons = document.querySelectorAll("#viewbar button[data-mode]");
    picture = VisdevView.mount(document.getElementById("view"), {
      onMode(mode) {
        modeButtons.forEach((button) => button.classList.toggle("on", button.dataset.mode === mode));
      },
      onPick(hit) {
        const payload = hit
          ? { type: "pick", from: "features", id: sessionId, name: hit.name, index: hit.index, kind: hit.kind, at: Date.now() }
          : { type: "pick", from: "features", clear: true, at: Date.now() };
        try { localStorage.setItem("visdev.featurePick", JSON.stringify(payload)); } catch (_err) { /* 仍走頻道 */ }
        channel.postMessage(payload);
        takePick(payload);
      },
    });
    modeButtons.forEach((button) => button.addEventListener("click", () => picture.setMode(button.dataset.mode)));
    document.getElementById("fit").onclick = () => picture.fit(true);
    document.getElementById("one").onclick = () => picture.one();
    document.getElementById("out").onclick = () => picture.zoomBy(1 / 1.25);
    document.getElementById("in").onclick = () => picture.zoomBy(1.25);
    displayChannel.onmessage = (event) => {
      const data = event.data;
      if (!data || data.type !== "display" || !data.display) return;
      if (sessionId && data.id && data.id !== sessionId) return;
      picture.setDisplay(data.display);
    };
    async function pullDisplay() {
      if (!sessionId) return;
      const res = await fetch(`/api/session/${encodeURIComponent(sessionId)}/display`);
      if (!res.ok) return;
      const data = await res.json();
      if (data.display) picture.setDisplay(data.display);
    }
    pullDisplay();
    setInterval(pullDisplay, 800);
    channel.onmessage = (event) => {
      takePick(event.data);
      takeVars(event.data);
    };
    window.addEventListener("storage", (event) => {
      if (event.key === "visdev.featurePick" && event.newValue) {
        try { takePick(JSON.parse(event.newValue)); } catch (_err) { /* 忽略 */ }
      }
      if (event.key === "visdev.customVars" && event.newValue) {
        try { takeVars(JSON.parse(event.newValue)); } catch (_err) { /* 忽略 */ }
      }
    });
    let seenPick = 0;
    setInterval(() => {
      const rawVars = localStorage.getItem("visdev.customVars");
      if (rawVars) {
        try { takeVars(JSON.parse(rawVars)); } catch (_err) { /* 忽略 */ }
      }
      const rawPick = localStorage.getItem("visdev.featurePick");
      if (!rawPick) return;
      try {
        const data = JSON.parse(rawPick);
        if (!data || data.at === seenPick) return;
        seenPick = data.at || 0;
        takePick(data);
      } catch (_err) { /* 忽略 */ }
    }, 300);

    try {
      const stored = JSON.parse(localStorage.getItem("visdev.featurePick") || "null");
      if (stored && stored.type === "pick" && !stored.clear) {
        pick = stored;
        seenPick = stored.at || 0;
      }
    } catch (_err) { /* 尚未點選 */ }
    try {
      takeVars(JSON.parse(localStorage.getItem("visdev.customVars") || "null"));
    } catch (_err) { /* 還沒有變數 */ }

    fetch("/api/features").then((res) => res.json()).then((data) => {
      if (data.region) catalog = data;
      build();
      refresh();
    }).catch(() => {
      build();
      refresh();
    });
  </script>
</body>
</html>
